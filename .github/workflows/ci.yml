name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spr-media-passport-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.22.0
          cache: npm

      - name: Verify lockfile is in sync
        run: npm install --package-lock-only --ignore-scripts --no-audit --fund=false && git diff --exit-code -- package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|sk_live_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16})' -- . ':!package-lock.json'; then
            echo "Potential secret detected"
            exit 1
          fi
      - name: Dependency license inventory
        run: node scripts/license-inventory.mjs > dependency-licenses.json
      - name: Generate CycloneDX SBOM
        run: npm sbom --omit=dev --sbom-format cyclonedx > constellation-sbom.json
      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: constellation-supply-chain
          path: |
            constellation-sbom.json
            dependency-licenses.json
          if-no-files-found: error
      - name: Run release checks
        run: npm run check

  migration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: media
          POSTGRES_PASSWORD: media
          POSTGRES_DB: media
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U media -d media"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://media:media@localhost:5432/media
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --fund=false
      - run: npm run build
      - name: Apply every migration to real PostgreSQL
        run: npm run migrate
      - name: Prove migrations are idempotent
        run: npm run migrate
      - name: Run PostgreSQL failure/concurrency gate
        run: npx vitest run tests/postgres-failure-gate.test.ts
      - name: Run Constellation PostgreSQL RLS adversarial gate
        run: npx vitest run tests/constellation-postgres-rls-adversarial.test.ts
      - name: Run tenant-table RLS coverage gate
        run: npx vitest run tests/all-tenant-tables-rls.test.ts tests/constellation-control-plane-rls.test.ts
      - name: Run API-key PostgreSQL concurrency attack gate
        run: npx vitest run tests/api-key-postgres-concurrency.test.ts
      - name: Run cross-tenant object-ID attack gate
        run: npx vitest run tests/cross-tenant-object-ids-postgres.test.ts
      - name: Run tenant pool-context reset gate
        run: npx vitest run tests/tenant-context-pool-reset.test.ts
      - name: Run pooled tenant-context reset gate
        run: npx vitest run tests/tenant-pool-reset-postgres.test.ts
      - name: Run authority/delegation cross-tenant ID attack gate
        run: npx vitest run tests/authority-object-ids-postgres.test.ts
      - name: Run Wormhole/M2M PostgreSQL attack gate
        run: npx vitest run tests/wormhole-m2m-postgres-adversarial.test.ts
      - name: Run evidence truth PostgreSQL attack gate
        run: npx vitest run tests/evidence-truth-postgres-adversarial.test.ts
