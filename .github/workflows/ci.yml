name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spr-media-passport-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: npm

      - name: Verify lockfile is in sync
        run: npm install --package-lock-only --ignore-scripts --no-audit --fund=false && git diff --exit-code -- package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high

      - name: Run release checks
        run: npm run check
