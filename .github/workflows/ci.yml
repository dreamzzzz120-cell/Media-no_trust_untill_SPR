name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: spr-media-passport-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Synchronize lockfile on main
        if: ${{ github.event_name == 'push' }}
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --fund=false
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: synchronize npm lockfile'
            git push
            exit 0
          fi
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Run release checks
        run: npm run check
