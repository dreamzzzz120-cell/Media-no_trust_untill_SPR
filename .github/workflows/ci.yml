name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spr-media-passport-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.22.0
          cache: npm

      - name: Verify lockfile is in sync
        run: npm install --package-lock-only --ignore-scripts --no-audit --fund=false && git diff --exit-code -- package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high

      - name: Run release checks
        run: npm run check

  migration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: media
          POSTGRES_PASSWORD: media
          POSTGRES_DB: media
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U media -d media"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://media:media@localhost:5432/media
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --fund=false
      - run: npm run build
      - name: Apply every migration to real PostgreSQL
        run: npm run migrate
      - name: Prove migrations are idempotent
        run: npm run migrate
      - name: Run PostgreSQL failure/concurrency gate
        run: npx vitest run tests/postgres-failure-gate.test.ts
      - name: Run Constellation PostgreSQL RLS adversarial gate
        run: npx vitest run tests/constellation-postgres-rls-adversarial.test.ts
